<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#ffffff"><title>MONO BIKE</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f3f3f3;color:#111;font-family:system-ui,-apple-system,'Segoe UI',sans-serif}.shell{max-width:880px;margin:20px auto;padding:18px;background:#fff;border:2px solid #111;border-radius:16px}header,.info,.tools,.board-head{display:flex;align-items:center;justify-content:space-between;gap:10px}h1{font-weight:900;font-size:24px;letter-spacing:.06em;margin:0}.tiny{font-size:12px;color:#555}.score{font-size:28px;font-weight:900;text-align:right}.info{font-size:13px;font-weight:750;margin:12px 0 8px}.progress{height:8px;border:1px solid #111;border-radius:8px;overflow:hidden;margin-bottom:10px}.progress>div{width:0;height:100%;background:#111}.scene{position:relative;border:2px solid #111;border-radius:10px;overflow:hidden;background:#fff;touch-action:manipulation}canvas{display:block;width:100%;height:auto;aspect-ratio:800/390;touch-action:manipulation}.overlay{position:absolute;inset:0;background:#ffffffd9;display:flex;align-items:center;justify-content:center}.dialog{border:3px solid #111;box-shadow:5px 5px 0 #111;border-radius:12px;background:white;text-align:center;color:#111;padding:20px;width:min(85%,320px)}.dialog h2{font-size:26px;margin:0 0 20px}.dialog button{background:#111;color:#fff;width:100%}button{font:inherit;font-weight:750;cursor:pointer;padding:12px 14px;border:1px solid #111;border-radius:9px;background:white;color:#111;touch-action:manipulation}button.primary{background:#111;color:#fff}button:focus-visible,input:focus-visible{outline:3px solid #777;outline-offset:2px}.tools{justify-content:stretch;margin-top:12px}.tools #jump{flex:1;min-height:62px;font-size:19px}.guide{text-align:center;font-size:12px;color:#555;margin:10px 0 17px}.board{border:1px solid #bbb;border-radius:10px;padding:12px}.board-head{font-size:14px;font-weight:bold;margin-bottom:8px}.rankrow{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px solid #ddd;font-size:13px}#entry{display:none}#entry input{width:100%;padding:9px;border:2px solid #111;border-radius:6px;margin-bottom:8px}#entry button{margin-bottom:8px;background:#eee;color:#111}#result{font-size:14px;display:none;margin-bottom:12px}@media(max-width:600px){body{background:#fff}.shell{border:0;padding:12px;margin:0}.tools button{padding:11px 9px}h1{font-size:21px}.dialog{padding:15px}}
</style></head>
<body><main class="shell"><header><h1>MONO BIKE</h1><div><div class="tiny" style="text-align:right">SCORE</div><div class="score" id="score">0</div></div></header><div class="info"><span>STAGE <span id="stage">1</span></span><span>★ <span id="coins">0</span>　 SHIELD <span id="shield">—</span></span></div><div class="progress"><div id="progress"></div></div><div class="scene"><canvas id="game" width="800" height="390" aria-label="自転車ゲーム"></canvas><div class="overlay" id="overlay"><div class="dialog"><h2 id="title">MONO BIKE</h2><div id="result"></div><div id="entry"><input id="player" maxlength="12" value="PLAYER" aria-label="プレイヤー名"><button id="save">ランキングに登録</button></div><button id="start">ゲームスタート ▶</button></div></div></div><div class="tools"><button id="jump" class="primary">↑ JUMP</button><button id="pause">一時停止</button><button id="reset">↻</button></div><div class="guide">スペース / ↑ / 画面タップでジャンプ ・ 2段ジャンプ可能</div><div class="board"><div class="board-head"><span>🏆 ランキング</span><button id="toggle" style="font-size:12px;padding:7px 10px">表示 / 非表示</button></div><div id="ranking" class="tiny">まだ記録がありません</div></div></main>
<script>
(()=>{'use strict';
const $=id=>document.getElementById(id),cv=$('game'),c=cv.getContext('2d'),W=800,H=390,PX=155,ST=1650;
let mode='ready',dist=0,score=0,coins=0,stage=1,speed=5.05,y=292,vy=0,air=false,jumps=0,shield=0,spawnX=470,obstacles=[],pickups=[],frame=0,last=0,notice=0,saved=false;
const storageKey='mono-bike-c935eee1-rank';let ranking=[];try{const r=JSON.parse(localStorage.getItem(storageKey)||'[]');if(Array.isArray(r))ranking=r.filter(x=>x&&typeof x.name==='string'&&Number.isFinite(x.score)).slice(0,5)}catch(_){}
let ac=null,bpm=60,nextBeat=0,beatIndex=0,pauseRemain=0,beatTimer=null;
function terrain(x){const u=((x%1500)+1500)%1500,z=Math.floor(Math.max(0,x)/1500),a=Math.min(125,68+z*8);if(u<300)return 304;if(u<550)return 304-a*(u-300)/250;if(u<760)return 304-a;if(u<1050)return 304-a*(1050-u)/290;return 304}
function slope(x){return(terrain(x+8)-terrain(x-8))/16}
function pit(x){return obstacles.some(o=>o.type==='pit'&&x>=o.x&&x<o.x+o.w)}
function audioReady(){try{ac=ac||new(window.AudioContext||window.webkitAudioContext)();if(ac.state==='suspended')ac.resume().catch(()=>{})}catch(_){ac=null}}
function tick(at){if(!ac||ac.state!=='running')return;let o=ac.createOscillator(),g=ac.createGain();o.type='sine';o.frequency.setValueAtTime(beatIndex%4===0?1020:820,at);g.gain.setValueAtTime(.0001,at);g.gain.exponentialRampToValueAtTime(.16,at+.006);g.gain.exponentialRampToValueAtTime(.0001,at+.085);o.connect(g).connect(ac.destination);o.start(at);o.stop(at+.09)}
function schedule(){if(mode!=='playing'||!ac||ac.state!=='running')return;const now=ac.currentTime;let n=0;while(nextBeat<now+.09&&n++<5){if(nextBeat<now-.13)nextBeat=now+.01;tick(Math.max(nextBeat,now+.006));beatIndex++;nextBeat+=60/bpm}}
function soundStop(){if(ac&&ac.state==='running')ac.suspend().catch(()=>{})}
function ui(){score=Math.floor(dist/10)+coins*25;$('score').textContent=score;$('stage').textContent=stage;$('coins').textContent=coins;$('shield').textContent=shield?'●':'—';$('progress').style.width=(dist%ST)/ST*100+'%'}
function modal(title,button){$('title').textContent=title;$('start').textContent=button;$('overlay').style.display='flex'}
function start(){audioReady();bpm=[45,60,75][Math.floor(Math.random()*3)];beatIndex=0;nextBeat=ac?ac.currentTime+.16:0;mode='playing';dist=0;score=0;coins=0;stage=1;speed=5.05;y=terrain(PX)-12;vy=0;air=false;jumps=0;shield=0;spawnX=470;obstacles=[];pickups=[];frame=0;notice=0;saved=false;$('overlay').style.display='none';$('entry').style.display='none';$('result').style.display='none';$('pause').textContent='一時停止';ui()}
function jump(){if(mode!=='playing')return;if(jumps<2){vy=jumps===0?-11.8:-10.1;air=true;jumps++}}
function lose(){mode='over';soundStop();modal('GAME OVER','もう一度プレイ ▶');$('result').textContent='SCORE '+score+'　｜　STAGE '+stage;$('result').style.display='block';$('entry').style.display='block';$('save').disabled=false;$('save').textContent='ランキングに登録'}
function pause(){if(mode==='playing'){mode='paused';pauseRemain=ac?Math.max(.01,nextBeat-ac.currentTime):.1;soundStop();modal('PAUSE','再開 ▶');$('result').style.display='none';$('entry').style.display='none';$('pause').textContent='再開'}else if(mode==='paused'){audioReady();nextBeat=ac?ac.currentTime+pauseRemain:0;mode='playing';$('overlay').style.display='none';$('pause').textContent='一時停止'}}
function createObstacle(){const x=spawnX,flat=Math.abs(slope(x))<.035&&Math.abs(terrain(x)-terrain(x+92))<3,p=flat&&Math.random()<(stage===1?.24:.34),width=p?65+Math.random()*25:28;obstacles.push({x,w:width,type:p?'pit':'cone',hit:false});if(Math.random()<.82){const ix=x+100+Math.random()*35;pickups.push({x:ix,y:terrain(ix)-75-Math.random()*24,type:Math.random()<.14?'shield':'coin',taken:false})}if(stage>=3&&Math.random()<.14)obstacles.push({x:x+125,w:28,type:'cone',hit:false});spawnX+=Math.max(190,255-(stage-1)*9)+Math.random()*110}
function update(dt){if(mode!=='playing')return;const d=Math.min(dt,2);frame+=d;speed=Math.max(4.4,Math.min(7.5,5.05+(stage-1)*.32-slope(dist+PX)*1.8));dist+=speed*d;while(spawnX<dist+W+50)createObstacle();const s=Math.floor(dist/ST)+1;if(stage!==s){stage=s;notice=100}const worldX=dist+PX,ground=terrain(worldX)-12,gap=pit(worldX);if(air||gap){air=true;vy+=.44*d;y+=vy*d;if(!gap&&vy>=0&&y>=ground){y=ground;vy=0;air=false;jumps=0}}else{y=ground;vy=0;jumps=0}if(y>H+40){if(shield){shield=0;y=ground-85;vy=-8;air=true;jumps=1}else{lose();return}}for(const o of obstacles){if(o.hit||o.type!=='cone')continue;const dx=o.x-worldX;if(dx<21&&dx+o.w>-20&&y>terrain(o.x+o.w/2)-43){o.hit=true;if(shield)shield=0;else{lose();return}}}for(const p of pickups){if(!p.taken&&Math.abs(p.x-worldX)<31&&Math.abs(p.y-(y-36))<64){p.taken=true;if(p.type==='coin')coins++;else shield=1}}obstacles=obstacles.filter(o=>o.x+o.w>dist-35);pickups=pickups.filter(p=>!p.taken&&p.x>dist-35);if(notice>0)notice-=d;ui()}
function line(a,b,color='#111',w=3){c.beginPath();c.moveTo(...a);c.lineTo(...b);c.lineWidth=w;c.strokeStyle=color;c.lineCap='round';c.stroke()}
function circle(x,y,r,fill='#fff',stroke='#111',w=3){c.beginPath();c.arc(x,y,r,0,Math.PI*2);c.fillStyle=fill;c.fill();if(stroke){c.strokeStyle=stroke;c.lineWidth=w;c.stroke()}}
function draw(){c.fillStyle='#fff';c.fillRect(0,0,W,H);circle(680,58,24,'#fff','#bbb',2);for(let i=0;i<7;i++){let x=((i*195-dist*.13)%1050+1050)%1050-80;line([x,243],[x+94,166],'#ddd',2);line([x+94,166],[x+204,244],'#ddd',2)}for(let i=0;i<8;i++){let x=((i*150-dist*.23)%1100+1100)%1100-40;c.strokeStyle='#ccc';c.lineWidth=2;c.strokeRect(x,194,62,45);c.strokeRect(x+14,206,12,12);c.strokeRect(x+39,206,12,12)}for(let sx=-3;sx<W+3;sx+=4){let wx=dist+sx;if(pit(wx+2))continue;let a=terrain(wx),b=terrain(wx+4);c.fillStyle='#eee';c.beginPath();c.moveTo(sx,a);c.lineTo(sx+4,b);c.lineTo(sx+4,H);c.lineTo(sx,H);c.fill();line([sx,a],[sx+4,b],'#111',3)}for(const o of obstacles){let x=o.x-dist,gy=terrain(o.x+o.w/2);if(o.type==='pit'){line([x,terrain(o.x)],[x,terrain(o.x)+19],'#111',3);line([x+o.w,terrain(o.x+o.w)],[x+o.w,terrain(o.x+o.w)+19],'#111',3)}else if(!o.hit){c.beginPath();c.moveTo(x+o.w/2,gy-32);c.lineTo(x+o.w,gy);c.lineTo(x,gy);c.closePath();c.fillStyle='#fff';c.fill();c.strokeStyle='#111';c.lineWidth=3;c.stroke();c.fillStyle='#111';c.fillRect(x+6,gy-8,o.w-12,5)}}for(const p of pickups){let x=p.x-dist;circle(x,p.y,12);c.textAlign='center';c.fillStyle='#111';c.font='bold 17px monospace';c.fillText(p.type==='coin'?'★':'S',x,p.y+6);c.textAlign='left'}c.save();c.translate(PX,y);if(shield){c.setLineDash([6,4]);circle(0,-44,75,'#ffffff00','#111',2);c.setLineDash([])}c.rotate(air?0:Math.atan(slope(dist+PX))*.8);for(const x of [-26,32]){circle(x,0,20,'#fff','#111',4);circle(x,0,3,'#111','#111',1)}line([-26,0],[-2,-26]);line([-2,-26],[10,0]);line([10,0],[-26,0]);line([10,0],[32,0]);line([-2,-26],[20,-26]);line([20,-26],[32,0]);line([18,-26],[22,-38]);line([22,-38],[34,-38]);line([-9,-28],[5,-28],'#111',5);let bob=Math.sin(frame*.19)*1.4;line([-9,-53+bob],[-9,-29],'#111',6);line([-9,-29],[4,-14],'#111',6);line([-9,-29],[-21,-12],'#111',6);line([-9,-53+bob],[14,-41],'#111',6);line([14,-41],[25,-36],'#111',5);line([-9,-53+bob],[-18,-71+bob],'#111',6);circle(-20,-81+bob,11,'#111','#111');c.fillStyle='#111';c.fillRect(-31,-94+bob,24,6);c.restore();c.fillStyle='#111';c.font='bold 14px monospace';c.fillText('STAGE '+String(stage).padStart(2,'0'),16,25);if(notice>0){c.fillStyle='#fff';c.fillRect(282,80,235,57);c.strokeStyle='#111';c.lineWidth=3;c.strokeRect(282,80,235,57);c.textAlign='center';c.fillStyle='#111';c.font='bold 24px monospace';c.fillText('STAGE '+stage+' !',400,116);c.textAlign='left'}}
function loop(t){const dt=last?(t-last)/16.667:1;last=t;update(dt);draw();requestAnimationFrame(loop)}
function renderRanks(){const el=$('ranking');el.replaceChildren();if(!ranking.length){el.textContent='まだ記録がありません';return}ranking.forEach((r,i)=>{const row=document.createElement('div'),a=document.createElement('span'),b=document.createElement('strong');row.className='rankrow';a.textContent=(i+1)+'位 '+r.name;b.textContent=r.score+' pt (ST.'+r.stage+')';row.append(a,b);el.append(row)})}
$('start').addEventListener('click',()=>mode==='paused'?pause():start());$('jump').addEventListener('pointerdown',e=>{e.preventDefault();jump()});cv.addEventListener('pointerdown',e=>{e.preventDefault();jump()});$('pause').addEventListener('click',pause);$('reset').addEventListener('click',start);$('save').addEventListener('click',()=>{if(saved||mode!=='over')return;ranking.push({name:($('player').value.trim()||'PLAYER').slice(0,12),score,stage});ranking.sort((a,b)=>b.score-a.score);ranking=ranking.slice(0,5);saved=true;try{localStorage.setItem(storageKey,JSON.stringify(ranking))}catch(_){}$('save').disabled=true;$('save').textContent='登録しました ✓';renderRanks()});$('toggle').addEventListener('click',()=>{$('ranking').style.display=$('ranking').style.display==='none'?'block':'none'});
window.addEventListener('keydown',e=>{if(document.activeElement&&document.activeElement.tagName==='INPUT')return;if(['Space','ArrowUp','KeyW'].includes(e.code)){e.preventDefault();if(!e.repeat)jump()}else if(e.code==='KeyP'&&!e.repeat)pause()});document.addEventListener('visibilitychange',()=>{if(document.hidden&&mode==='playing')pause()});window.addEventListener('pagehide',soundStop);beatTimer=setInterval(schedule,25);renderRanks();requestAnimationFrame(loop);
})();
</script></body></html>
